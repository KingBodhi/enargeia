[package]
name = "entity-resolver"
version = "0.1.0"
edition = "2021"
description = "Standalone entity-resolution / world-model graph layer: ingest -> resolve -> reason. Decoupled from pcg-cc-mcp's live DB by design."

[[bin]]
name = "wm-cli"
path = "src/bin/wm-cli.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
quick-xml = "0.37"
strsim = "0.11"
regex = "1"
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
async-trait = "0.1"

[lints.clippy]
print_stdout = "allow"
print_stderr = "allow"
